<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ANDRÉE – Official Merch</title>
<meta name="description" content="ANDRÉE – oficiální merch a streetwear od českého umělce. Official merch and streetwear by Czech artist Andrée.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--fg:#000;--mute:#777;--line:#e4e4e4;--frame:#efefef;--hdr:56px;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#000;--fg:#fff;--mute:#999;--line:#262626;--frame:#161616}}
*,*::before,*::after{box-sizing:inherit;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:var(--hdr)}
body{font-family:"Archivo",Helvetica,Arial,sans-serif;background:var(--bg);color:var(--fg);line-height:1.5;overflow-x:hidden;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
img{max-width:100%;display:block}
:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
.wrap{padding:0 clamp(16px,3vw,40px);max-width:1600px;margin:0 auto}
.u{font-stretch:75%;font-weight:800;text-transform:uppercase;letter-spacing:.02em}

/* header */
header{position:sticky;top:0;z-index:50;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{height:var(--hdr);display:flex;align-items:center;justify-content:space-between;gap:16px}
.logo{font-stretch:62%;font-weight:900;font-size:26px;letter-spacing:.04em;line-height:1}
nav.d{display:flex;gap:28px;align-items:center;font-stretch:75%;font-weight:700;text-transform:uppercase;font-size:14px;letter-spacing:.06em}
nav.d a,.lang button{position:relative;padding:4px 0}
nav.d a::after{content:"";position:absolute;left:0;bottom:0;height:1px;width:100%;background:currentColor;transform:scaleX(0);transform-origin:left;transition:transform .25s}
nav.d a:hover::after{transform:scaleX(1)}
.lang button{opacity:.4;transition:opacity .2s}
.lang button[aria-pressed=true],.lang button:hover{opacity:1}
.lang span{opacity:.4;margin:0 3px}
.icons{display:flex;align-items:center;gap:6px}
.ib{width:44px;height:44px;display:grid;place-items:center;position:relative}
.ib svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6}
.count{position:absolute;top:5px;right:3px;min-width:17px;height:17px;border-radius:9px;background:var(--fg);color:var(--bg);font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.count[hidden]{display:none}
.bump{animation:bump .4s}
@keyframes bump{40%{transform:scale(1.35)}}
.burger{display:none}
.mnav{display:none;border-top:1px solid var(--line);padding:8px 0 16px}
.mnav a,.mnav .lang{display:block;padding:12px 0;font-stretch:75%;font-weight:800;text-transform:uppercase;font-size:22px}
.mnav.open{display:block;animation:fade .25s}
@keyframes fade{from{opacity:0;transform:translateY(-6px)}}
@media(max-width:760px){nav.d{display:none}.burger{display:grid}}

/* hero */
.hero{position:relative;height:min(82vh,820px);min-height:420px;background:#111;overflow:hidden;color:#fff}
.slide{position:absolute;inset:0;opacity:0;transition:opacity 1s ease;display:flex;align-items:flex-end}
.slide.on{opacity:1;z-index:1}
.slide .bg{position:absolute;inset:0;background-size:cover;background-position:center;transform:scale(1.04);transition:transform 7s ease-out}
.slide.on .bg{transform:scale(1)}
.slide .ph{position:absolute;top:16px;left:clamp(16px,3vw,40px);font-size:11px;opacity:.55}
.slide .shade{position:absolute;inset:0;background:rgba(0,0,0,.28)}
.cap{position:relative;padding-bottom:clamp(56px,9vw,96px);width:100%}
.cap h1,.cap h2{font-stretch:62%;font-weight:900;text-transform:uppercase;line-height:.88;font-size:clamp(52px,12vw,180px);letter-spacing:.01em}
.btn{display:inline-block;margin-top:22px;padding:13px 26px;background:#fff;color:#000;font-stretch:75%;font-weight:800;text-transform:uppercase;letter-spacing:.08em;font-size:14px;border:1px solid #fff;transition:background .2s,color .2s}
.btn:hover{background:transparent;color:#fff}
.btn.dk{background:var(--fg);color:var(--bg);border-color:var(--fg);width:100%;text-align:center}
.btn.dk:hover{background:transparent;color:var(--fg)}
.btn[disabled]{opacity:.35;pointer-events:none}
.arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:3;width:48px;height:48px;display:grid;place-items:center;color:#fff;opacity:.75;transition:opacity .2s}
.arrow:hover{opacity:1}
.arrow svg{width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:1.5}
.prev{left:6px}.next{right:6px}
.dots{position:absolute;z-index:3;right:clamp(16px,3vw,40px);bottom:24px;display:flex;gap:4px}
.dots button{width:36px;height:24px;display:grid;align-items:center}
.dots button::before{content:"";height:2px;background:rgba(255,255,255,.4);transition:background .3s}
.dots button[aria-current=true]::before{background:#fff}
@media(max-width:600px){.arrow{display:none}.hero{height:72vh}}

/* sections */
section{padding:clamp(40px,6vw,80px) 0}
.sh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:24px}
.sh h2{font-stretch:62%;font-weight:900;text-transform:uppercase;font-size:clamp(34px,5vw,60px);line-height:1}
.sh a{font-size:14px;border-bottom:1px solid currentColor;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:24px 12px}
@media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr);gap:32px 16px}}
.card{text-align:left;display:block;width:100%}
.frame{aspect-ratio:4/5;background:var(--frame);overflow:hidden;position:relative;display:grid;place-items:center}
.frame img,.frame .blank{width:100%;height:100%;object-fit:cover;transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.frame .blank{display:grid;place-items:center;color:var(--mute);font-size:12px}
.card:hover .frame>*{transform:scale(1.04)}
.card .n{margin-top:12px;font-weight:600;font-size:15px;display:flex;justify-content:space-between;gap:8px}
.card .s{color:var(--mute);font-size:13px}
.rv{opacity:0;transform:translateY(14px);transition:opacity .7s,transform .7s}
.rv.in{opacity:1;transform:none}

/* video */
.video{border-top:1px solid var(--line)}
.vid{aspect-ratio:16/9;width:100%;background:#000;max-width:1100px}
.vid iframe{width:100%;height:100%;border:0}

/* footer */
footer{border-top:1px solid var(--line);padding:40px 0 24px}
.fg{display:grid;gap:28px;grid-template-columns:1fr}
@media(min-width:760px){.fg{grid-template-columns:2fr 1fr 1fr}}
.fg .logo{font-size:44px}
.fg ul{list-style:none;font-size:15px}
.fg li{padding:2px 0}
.fg a:hover{text-decoration:underline}
.fb{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:44px;font-size:12px;color:var(--mute)}
.cur button{padding:6px 2px;opacity:.5;font-weight:600;color:var(--fg)}
.cur button[aria-pressed=true]{opacity:1;border-bottom:1px solid var(--fg)}
.cur span{margin:0 4px}

/* overlay panels */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .3s;z-index:90}
.ov.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(420px,100%);background:var(--bg);z-index:100;transform:translateX(100%);transition:transform .35s cubic-bezier(.2,.7,.2,1);display:flex;flex-direction:column}
.drawer.on{transform:none}
.dh{display:flex;justify-content:space-between;align-items:center;padding:8px 8px 8px 20px;border-bottom:1px solid var(--line)}
.dh h3{font-stretch:75%;font-weight:800;text-transform:uppercase;font-size:20px}
.db{flex:1;overflow:auto;padding:8px 20px}
.df{padding:20px;border-top:1px solid var(--line)}
.row{display:flex;gap:14px;padding:16px 0;border-bottom:1px solid var(--line)}
.row .th{width:72px;aspect-ratio:4/5;background:var(--frame);flex:none}
.row .i{flex:1;font-size:14px}
.row .i b{display:block;font-size:15px}
.q{display:inline-flex;align-items:center;border:1px solid var(--line);margin-top:8px}
.q button{width:32px;height:32px}
.q span{min-width:28px;text-align:center}
.rm{font-size:12px;color:var(--mute);text-decoration:underline;margin-left:10px}
.sub{display:flex;justify-content:space-between;font-weight:700;margin-bottom:6px}
.note{font-size:12px;color:var(--mute);margin-bottom:14px}
.empty{padding:48px 0;text-align:center;color:var(--mute)}
.modal{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:16px;pointer-events:none;opacity:0;transition:opacity .3s}
.modal.on{opacity:1;pointer-events:auto}
.mb{background:var(--bg);width:min(900px,100%);max-height:100%;overflow:auto;display:grid;grid-template-columns:1fr;transform:translateY(12px);transition:transform .3s;position:relative}
.modal.on .mb{transform:none}
@media(min-width:760px){.mb{grid-template-columns:1fr 1fr}}
.mi{padding:24px;display:flex;flex-direction:column;gap:14px}
.mi h3{font-stretch:62%;font-weight:900;text-transform:uppercase;font-size:40px;line-height:1}
.sz{display:flex;gap:8px;flex-wrap:wrap}
.sz button{min-width:48px;height:44px;border:1px solid var(--line);font-weight:600;transition:border-color .2s,background .2s,color .2s}
.sz button:hover{border-color:var(--fg)}
.sz button[aria-pressed=true]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.x{position:absolute;top:4px;right:4px;z-index:2}
.err{color:#c33;font-size:13px;min-height:18px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}html{scroll-behavior:auto}.rv{opacity:1;transform:none}}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="bar">
      <a href="#top" class="logo" aria-label="ANDRÉE">ANDRÉE</a>
      <nav class="d" aria-label="Main">
        <a href="#shop" data-t="nav_shop"></a>
        <a href="https://www.youtube.com/@ANDREEDRKSD" target="_blank" rel="noopener">YouTube</a>
        <span class="lang"><button data-lang="cs" aria-pressed="true">CS</button><span>/</span><button data-lang="en" aria-pressed="false">EN</button></span>
      </nav>
      <div class="icons">
        <button class="ib" id="cartBtn" data-al="cart" aria-label="Cart">
          <svg viewBox="0 0 24 24"><path d="M5 8h14l-1 12H6L5 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
          <span class="count" id="count" hidden>0</span>
        </button>
        <button class="ib burger" id="burger" aria-expanded="false" aria-controls="mnav" data-al="menu" aria-label="Menu">
          <svg viewBox="0 0 24 24"><path d="M4 8h16M4 16h16"/></svg>
        </button>
      </div>
    </div>
    <div class="mnav" id="mnav">
      <a href="#shop" data-t="nav_shop"></a>
      <a href="https://www.youtube.com/@ANDREEDRKSD" target="_blank" rel="noopener">YouTube</a>
      <span class="lang"><button data-lang="cs" aria-pressed="true">CS</button><span>/</span><button data-lang="en" aria-pressed="false">EN</button></span>
    </div>
  </div>
</header>

<main id="top">
  <!-- HERO -->
  <div class="hero" id="hero" role="region" aria-roledescription="carousel" aria-label="Andrée">
    <button class="arrow prev" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></svg></button>
    <button class="arrow next" aria-label="Next"><svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg></button>
    <div class="dots" id="dots"></div>
  </div>

  <!-- PRODUCTS -->
  <section id="shop">
    <div class="wrap">
      <div class="sh rv"><h2 data-t="shop_h"></h2></div>
      <div class="grid rv" id="grid"></div>
    </div>
  </section>

  <!-- VIDEO -->
  <section class="video">
    <div class="wrap">
      <div class="sh rv">
        <h2 data-t="video_h"></h2>
        <a href="https://www.youtube.com/@ANDREEDRKSD" target="_blank" rel="noopener" data-t="video_link"></a>
      </div>
      <div class="vid rv">
        <iframe src="https://www.youtube.com/embed/5QwvGg13Xnk?start=4" title="ANDRÉE – YouTube" loading="lazy"
          allow="accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
      </div>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">
    <div class="fg">
      <div><div class="logo">ANDRÉE</div></div>
      <div>
        <ul>
          <li><a href="https://www.instagram.com/andreedrksd/?igshid=9919x2zau0o4&fbclid=IwAR0NL1OPqTJpmo6j_nB-RySkfmEQ77EPwTYMu2_qwgehCDyo2qLwMijjRgw" target="_blank" rel="noopener">Instagram</a></li>
          <li><a href="https://www.youtube.com/@ANDREEDRKSD" target="_blank" rel="noopener">YouTube</a></li>
        </ul>
      </div>
      <div>
        <ul>
          <li><a href="mailto:email@andree.cz">email@andree.cz</a></li>
        </ul>
      </div>
    </div>
    <div class="fb">
      <div class="cur" role="group" aria-label="Currency">
        <button data-cur="CZK" aria-pressed="true">CZK</button><span>/</span><button data-cur="EUR" aria-pressed="false">EUR</button>
      </div>
      <div>© <span id="yr"></span> ANDRÉE</div>
      <div>made by <a href="#top" style="text-decoration:underline">Donda Digital</a></div>
    </div>
  </div>
</footer>

<!-- Cart drawer -->
<div class="ov" id="ov"></div>
<aside class="drawer" id="drawer" aria-hidden="true" aria-label="Cart">
  <div class="dh"><h3 data-t="cart_h"></h3><button class="ib" data-close data-al="close" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
  <div class="db" id="cartBody"></div>
  <div class="df" id="cartFoot"></div>
</aside>

<!-- Product modal -->
<div class="modal" id="modal" aria-hidden="true" role="dialog" aria-modal="true">
  <div class="mb">
    <button class="ib x" data-close data-al="close" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    <div class="frame" style="aspect-ratio:auto;min-height:320px" id="mImg"></div>
    <div class="mi" id="mInfo"></div>
  </div>
</div>

<script>
/* ============ EDIT HERE ============ */
const EUR_RATE = 25;               // 1 EUR = 25 CZK (update as needed)
const SLIDES = [                   // replace img with your photo URL / path
  {img:"", tone:"#1a1a1a", cs:["Nový drop","Objevit drop"], en:["New drop","Discover the drop"]},
  {img:"", tone:"#2a2a2a", cs:["Andrée","Nakupovat"],        en:["Andrée","Shop now"]},
  {img:"", tone:"#0f0f0f", cs:["Merch","Nakupovat"],         en:["Merch","Shop now"]}
];
const PRODUCTS = [                 // price in CZK; img = product photo URL
  {id:1,name:"Produkt 1",price:0,img:"",sizes:["S","M","L","XL"]},
  {id:2,name:"Produkt 2",price:0,img:"",sizes:["S","M","L","XL"]},
  {id:3,name:"Produkt 3",price:0,img:"",sizes:["S","M","L","XL"]},
  {id:4,name:"Produkt 4",price:0,img:"",sizes:["S","M","L","XL"]}
];
/* =================================== */

const T={
cs:{nav_shop:"Shop",shop_h:"Nejnovější drop",video_h:"Nejnovější video",video_link:"Navštívit YouTube",
 soon:"Připravujeme",size:"Velikost",pick:"Vyberte velikost",add:"Přidat do košíku",added:"Přidáno",cart_h:"Košík",
 empty:"Váš košík je prázdný.",sub:"Mezisoučet",checkout:"Pokladna (brzy)",demo:"Ukázkový košík – platby zatím nejsou aktivní.",
 remove:"Odebrat",ph:"Zástupný obrázek – nahraďte fotografií",cart:"Košík",menu:"Menu",close:"Zavřít"},
en:{nav_shop:"Shop",shop_h:"Latest drop",video_h:"Latest video",video_link:"Visit YouTube",
 soon:"Coming soon",size:"Size",pick:"Select a size",add:"Add to cart",added:"Added",cart_h:"Cart",
 empty:"Your cart is empty.",sub:"Subtotal",checkout:"Checkout (soon)",demo:"Demo cart – payments are not active yet.",
 remove:"Remove",ph:"Placeholder image – replace with a photo",cart:"Cart",menu:"Menu",close:"Close"}};

const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
let lang="cs", cur="CZK", cart=[], slide=0, timer, openProd=null, selSize=null;
try{lang=localStorage.getItem("a_lang")||"cs";cur=localStorage.getItem("a_cur")||"CZK";cart=JSON.parse(localStorage.getItem("a_cart")||"[]")}catch(e){}
const t=k=>T[lang][k];
const money=n=>cur==="CZK"?n.toFixed(2)+" CZK":(n/EUR_RATE).toFixed(2)+" EUR";
const save=()=>{try{localStorage.setItem("a_lang",lang);localStorage.setItem("a_cur",cur);localStorage.setItem("a_cart",JSON.stringify(cart))}catch(e){}};
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;

/* hero */
function buildHero(){
  $$(".slide").forEach(s=>s.remove());
  const hero=$("#hero"), dots=$("#dots");
  dots.innerHTML="";
  SLIDES.forEach((s,i)=>{
    const [h,b]=s[lang];
    const el=document.createElement("div");
    el.className="slide"+(i===slide?" on":"");
    el.setAttribute("role","group");el.setAttribute("aria-label",(i+1)+" / "+SLIDES.length);
    el.innerHTML=`<div class="bg" style="background-color:${s.tone};${s.img?`background-image:url('${s.img}')`:""}"></div>
      ${s.img?'<div class="shade"></div>':`<div class="ph">${t("ph")}</div>`}
      <div class="wrap cap">${i===0?`<h1>${h}</h1>`:`<h2>${h}</h2>`}<a class="btn" href="#shop">${b}</a></div>`;
    hero.insertBefore(el,dots);
    const d=document.createElement("button");
    d.setAttribute("aria-label","Slide "+(i+1));
    d.setAttribute("aria-current",i===slide);
    d.onclick=()=>{go(i);restart()};
    dots.appendChild(d);
  });
}
function go(n){
  slide=(n+SLIDES.length)%SLIDES.length;
  $$(".slide").forEach((s,i)=>s.classList.toggle("on",i===slide));
  $$("#dots button").forEach((d,i)=>d.setAttribute("aria-current",i===slide));
}
function restart(){clearInterval(timer);if(!reduce)timer=setInterval(()=>go(slide+1),5500)}
$(".prev").onclick=()=>{go(slide-1);restart()};
$(".next").onclick=()=>{go(slide+1);restart()};
$("#hero").addEventListener("mouseenter",()=>clearInterval(timer));
$("#hero").addEventListener("mouseleave",restart);
let tx=0;
$("#hero").addEventListener("touchstart",e=>tx=e.touches[0].clientX,{passive:true});
$("#hero").addEventListener("touchend",e=>{const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>40){go(slide+(d<0?1:-1));restart()}});

/* products */
const imgOrBlank=(p)=>p.img?`<img src="${p.img}" alt="${p.name}" loading="lazy">`:`<div class="blank"></div>`;
function renderGrid(){
  $("#grid").innerHTML=PRODUCTS.map(p=>`
    <button class="card" data-id="${p.id}" aria-label="${p.name}">
      <div class="frame">${imgOrBlank(p)}</div>
      <div class="n"><span>${p.name}</span><span>${money(p.price)}</span></div>
      <div class="s">${t("soon")}</div>
    </button>`).join("");
}
$("#grid").addEventListener("click",e=>{const c=e.target.closest(".card");if(c)openModal(+c.dataset.id)});

/* modal */
function renderModal(){
  const p=openProd;if(!p)return;
  $("#mImg").innerHTML=imgOrBlank(p);
  $("#mInfo").innerHTML=`<h3>${p.name}</h3>
    <div style="font-weight:600">${money(p.price)}</div>
    <div class="s" style="color:var(--mute);font-size:13px">${t("soon")}</div>
    <div><div style="font-size:13px;margin-bottom:8px">${t("size")}</div>
      <div class="sz">${p.sizes.map(s=>`<button data-size="${s}" aria-pressed="${s===selSize}">${s}</button>`).join("")}</div></div>
    <div class="err" id="err" role="alert"></div>
    <button class="btn dk" id="addBtn" style="margin-top:0">${t("add")}</button>`;
}
function openModal(id){
  openProd=PRODUCTS.find(p=>p.id===id);selSize=null;renderModal();
  $("#modal").classList.add("on");$("#ov").classList.add("on");$("#modal").setAttribute("aria-hidden","false");
  setTimeout(()=>$("#modal .x").focus(),50);
}
$("#mInfo").addEventListener("click",e=>{
  const s=e.target.closest("[data-size]");
  if(s){selSize=s.dataset.size;renderModal();return}
  if(e.target.id==="addBtn"){
    if(!selSize){$("#err").textContent=t("pick");return}
    const k=openProd.id+"-"+selSize, f=cart.find(i=>i.key===k);
    f?f.qty++:cart.push({key:k,id:openProd.id,size:selSize,qty:1});
    save();renderCart();
    const c=$("#count");c.classList.remove("bump");void c.offsetWidth;c.classList.add("bump");
    const b=$("#addBtn");b.textContent="✓ "+t("added");
    setTimeout(()=>{closeAll();openCart()},600);
  }
});

/* cart */
function renderCart(){
  const n=cart.reduce((a,i)=>a+i.qty,0);
  const c=$("#count");c.textContent=n;c.hidden=!n;
  const body=$("#cartBody"), foot=$("#cartFoot");
  if(!cart.length){body.innerHTML=`<p class="empty">${t("empty")}</p>`;foot.innerHTML="";return}
  let sum=0;
  body.innerHTML=cart.map(i=>{
    const p=PRODUCTS.find(x=>x.id===i.id);sum+=p.price*i.qty;
    return `<div class="row"><div class="th">${p.img?`<img src="${p.img}" alt="" style="width:100%;height:100%;object-fit:cover">`:""}</div>
      <div class="i"><b>${p.name}</b>${t("size")}: ${i.size} · ${money(p.price)}<br>
      <span class="q"><button data-q="-1" data-k="${i.key}" aria-label="−">−</button><span>${i.qty}</span><button data-q="1" data-k="${i.key}" aria-label="+">+</button></span>
      <button class="rm" data-rm="${i.key}">${t("remove")}</button></div></div>`}).join("");
  foot.innerHTML=`<div class="sub"><span>${t("sub")}</span><span>${money(sum)}</span></div>
    <p class="note">${t("demo")}</p><button class="btn dk" disabled>${t("checkout")}</button>`;
}
$("#cartBody").addEventListener("click",e=>{
  const q=e.target.closest("[data-q]"),r=e.target.closest("[data-rm]");
  if(q){const i=cart.find(x=>x.key===q.dataset.k);i.qty+=+q.dataset.q;if(i.qty<1)cart=cart.filter(x=>x!==i)}
  if(r)cart=cart.filter(x=>x.key!==r.dataset.rm);
  save();renderCart();
});
function openCart(){$("#drawer").classList.add("on");$("#ov").classList.add("on");$("#drawer").setAttribute("aria-hidden","false");setTimeout(()=>$("#drawer [data-close]").focus(),50)}
function closeAll(){["#drawer","#modal"].forEach(s=>{$(s).classList.remove("on");$(s).setAttribute("aria-hidden","true")});$("#ov").classList.remove("on")}
$("#cartBtn").onclick=openCart;
$("#ov").onclick=closeAll;
$$("[data-close]").forEach(b=>b.onclick=closeAll);
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeAll()});

/* menu */
$("#burger").onclick=()=>{const m=$("#mnav"),o=m.classList.toggle("open");$("#burger").setAttribute("aria-expanded",o)};
$$("#mnav a").forEach(a=>a.onclick=()=>$("#mnav").classList.remove("open"));

/* language + currency */
function applyLang(){
  document.documentElement.lang=lang;
  $$("[data-t]").forEach(el=>el.textContent=t(el.dataset.t));
  $$("[data-al]").forEach(el=>el.setAttribute("aria-label",t(el.dataset.al)));
  $$("[data-lang]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===lang));
  $$("[data-cur]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.cur===cur));
  buildHero();renderGrid();renderCart();renderModal();
}
$$("[data-lang]").forEach(b=>b.onclick=()=>{lang=b.dataset.lang;save();applyLang()});
$$("[data-cur]").forEach(b=>b.onclick=()=>{cur=b.dataset.cur;save();applyLang()});

/* reveal on scroll */
const io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add("in");io.unobserve(x.target)}}),{threshold:.08});
$$(".rv").forEach(el=>io.observe(el));

$("#yr").textContent=new Date().getFullYear();
applyLang();restart();
</script>
</body>
</html>
